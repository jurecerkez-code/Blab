<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blab</title>
  </head>
  <body>
    <main id="app">
      <header class="bar">
        <h1>Blab</h1>
        <div class="bar-right">
          <span id="folder-name" class="muted"></span>
          <button id="pick-folder" class="ghost">Pick folder</button>
        </div>
      </header>

      <section id="setup" class="card hidden">
        <p>Blab keeps everything as plain files in a folder you pick. Nothing leaves this machine.</p>
        <button id="setup-pick" class="primary">Pick a folder</button>
      </section>

      <section id="recorder" class="card hidden">
        <input id="title" type="text" placeholder="What is this talk?" autocomplete="off" />
        <label class="check" title="Adds what the computer is playing, so the other side of a call is recorded too.">
          <input id="meeting" type="checkbox" />
          Record computer audio too
        </label>
        <div class="row">
          <button id="record" class="record">Record</button>
          <!-- Only useful mid-recording, so it stays out of the way until then. -->
          <button id="pause" class="ghost hidden">Pause</button>
          <span id="timer" class="timer">00:00</span>
          <span class="spacer"></span>
          <label class="pick" for="model">Model</label>
          <select id="model" aria-label="Transcription model"></select>
        </div>
        <!-- Decorative: the status line already says the same in words. -->
        <div id="meter" class="meter" aria-hidden="true"></div>
        <!-- Live captions land here; they are previews, never the transcript. -->
        <div id="captions" class="captions"></div>
        <textarea id="notes" placeholder="Your notes. Type while it records."></textarea>
      </section>

      <!-- Outside #recorder so setup errors are visible before a folder is picked. -->
      <p id="status" class="status"></p>
      <button id="mic-settings" class="ghost hidden">Open microphone settings</button>

      <section id="library" class="hidden">
        <div class="library-head">
          <h2>Recordings</h2>
          <button id="import" class="ghost">Import audio…</button>
          <input id="import-file" type="file" hidden
            accept="audio/*,.mp4,.m4v,.mov,.aac,.m4b" />
        </div>
        <ul id="list"></ul>
        <p id="empty" class="muted">
          Nothing yet. Type a title above and press Record — Blab makes a folder
          for each recording itself, so you do not create any by hand.
        </p>
      </section>

      <section id="detail" class="card hidden"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
