# Builds all three installers and leaves them on a draft release.
#
# This exists because electron-builder only builds for the machine it runs on,
# so a Windows laptop cannot produce the Mac dmg, a Mac cannot produce the
# Windows exe, and neither can produce the Linux AppImage. Until now that meant
# every release needed a machine of each kind, and it showed: 0.3.2 shipped as
# an exe with no dmg beside it, so anyone on a Mac was still on 0.3.1.
#
# GitHub lends out all three, so the builds happen side by side and land on the
# same release.
#
# The result is always a DRAFT. Nothing is public until a human reads it and
# presses publish.
name: Release

on:
  push:
    tags: ['v*']
  # So a build can be tried without tagging anything first.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing must not cancel the others. A partial release is
      # worth having; it is what every release before this one was.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            installer: Blab-*.dmg
          - os: windows-latest
            installer: Blab-Setup-*.exe
          - os: ubuntu-latest
            installer: Blab-*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # 22, not 20: electron-builder pulls node-abi, which declares
      # `node: >=22.12.0`, so packaging on 20 runs it outside its own supported
      # range and npm says so on every install.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The one network moment in the project: the Whisper weights, which are
      # not in git and are baked into the installer.
      #
      # `all`, explicitly. A release ships Fast, Balanced and Best inside the
      # installer and the app picks between them on first launch, so a build
      # that fetched one model would produce an installer missing two of the
      # three it offers.
      - run: npm run setup all

      - run: npm run build

      # Blab is not signed by anybody — the README says so and explains the
      # warning users get. Without this, electron-builder goes looking for a
      # certificate on the runner and fails when it does not find one, rather
      # than doing the ad-hoc signing the config asks for.
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # One dmg is supposed to run on an Intel Mac and on an M-series, and
      # nothing in the build objects if that quietly becomes one of them: the
      # file has the same name, the same shape, and uploads the same way. Half
      # the Macs in the world would be the ones to find out. So mount what was
      # actually built and ask the binary inside which chips it holds, rather
      # than trusting that the arch in package.json survived the trip.
      - name: The dmg must carry both chips
        if: runner.os == 'macOS'
        run: |
          set -eu
          dmg=$(ls Blab-*.dmg)
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint /tmp/blab-dmg
          archs=$(lipo -archs '/tmp/blab-dmg/Blab.app/Contents/MacOS/Blab')
          hdiutil detach /tmp/blab-dmg -quiet
          echo "$dmg carries: $archs"
          for want in x86_64 arm64; do
            case " $archs " in
              *" $want "*) ;;
              *) echo "::error::$dmg has no $want slice (found: $archs)"; exit 1 ;;
            esac
          done

      # A release asset is capped at 2 GB by GitHub. Three models in one
      # installer puts the dmg within sight of that, and the upload is the
      # place it would be discovered — after every build has already run.
      - name: No installer may exceed the 2 GB release limit
        shell: bash
        run: |
          set -eu
          for f in ${{ matrix.installer }}; do
            bytes=$(wc -c < "$f")
            printf '%s is %s MB\n' "$f" "$((bytes / 1000000))"
            if [ "$bytes" -gt 2000000000 ]; then
              echo "::error::$f is over the 2 GB limit for a release asset."
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  draft:
    needs: build
    # Only a tag becomes a release. A manual run is for finding out whether the
    # build still works, and leaves the artifacts on the run itself.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh installers
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Blab ${TAG#v}" \
            --generate-notes
