<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="380" viewBox="0 0 1060 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Blab runs entirely on your computer: you record and type, Blab captures, Whisper and the silence detector turn speech into timed text, and everything lands in your folder as plain files.">
  <title>How Blab works</title>
  <rect width="1060" height="380" fill="#14140f"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb454"/>
    </marker>
  </defs>

  <rect x="255" y="64" width="775" height="204" rx="16" fill="none" stroke="#3a3a30" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="280" y="92" fill="#918d80" font-size="14">your computer</text>

  <rect x="30" y="118" width="205" height="112" rx="12" fill="#1d1d17" stroke="#33332a"/>
  <text x="50" y="156" fill="#f2efe6" font-size="19" font-weight="600">You</text>
  <text x="50" y="184" fill="#918d80" font-size="13">record a talk</text>
  <text x="50" y="206" fill="#918d80" font-size="13">type notes while it runs</text>

  <line x1="240" y1="174" x2="282" y2="174" stroke="#ffb454" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="261" y="160" fill="#918d80" font-size="12" text-anchor="middle">record</text>

  <rect x="288" y="118" width="205" height="112" rx="12" fill="#1d1d17" stroke="#33332a"/>
  <text x="308" y="156" fill="#f2efe6" font-size="19" font-weight="600">Blab</text>
  <text x="308" y="184" fill="#918d80" font-size="13">Electron + TypeScript</text>
  <text x="308" y="206" fill="#918d80" font-size="13">the window you use</text>

  <line x1="498" y1="174" x2="540" y2="174" stroke="#ffb454" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="519" y="160" fill="#918d80" font-size="12" text-anchor="middle">audio</text>

  <rect x="546" y="118" width="205" height="112" rx="12" fill="#1d1d17" stroke="#33332a"/>
  <text x="566" y="156" fill="#f2efe6" font-size="19" font-weight="600">Whisper + VAD</text>
  <text x="566" y="184" fill="#918d80" font-size="13">a worker thread</text>
  <text x="566" y="206" fill="#918d80" font-size="13">speech in, timed text out</text>

  <line x1="756" y1="174" x2="798" y2="174" stroke="#ffb454" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="777" y="160" fill="#918d80" font-size="12" text-anchor="middle">text</text>

  <rect x="804" y="118" width="205" height="112" rx="12" fill="#1d1d17" stroke="#33332a"/>
  <text x="824" y="156" fill="#f2efe6" font-size="19" font-weight="600">Your folder</text>
  <text x="824" y="184" fill="#918d80" font-size="13">audio.webm</text>
  <text x="824" y="206" fill="#918d80" font-size="13">notes.md + transcript.md</text>

  <text x="530" y="340" fill="#918d80" font-size="14" text-anchor="middle">Everything above runs on your computer. The network is blocked at runtime, not just promised.</text>
</svg>
